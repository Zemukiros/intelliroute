# IntelliRoute local development stack.
# All services run locally; nothing here provisions cloud resources.
#
#   docker compose up --build
#
# api:        Spring Boot routing engine     -> http://localhost:8080
# ai-service: FastAPI ranking service        -> http://localhost:8090
# web:        Next.js frontend               -> http://localhost:3000

services:
  api:
    build:
      context: ./services/api
    ports:
      - "8080:8080"
    environment:
      # Relaxed-binding names: BASEURL -> base-url, ALLOWEDORIGINS -> allowed-origins
      INTELLIROUTE_CORS_ALLOWEDORIGINS: http://localhost:3000
      INTELLIROUTE_RANKING_BASEURL: http://ai-service:8090
    depends_on:
      - ai-service
    healthcheck:
      # Dependency-free TCP probe (the JRE image ships no curl/wget).
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 3s
      retries: 10

  ai-service:
    build:
      context: ./services/ai-service
    ports:
      - "8090:8090"
    environment:
      RANKING_PROVIDER: deterministic

  web:
    build:
      context: ./apps/web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    depends_on:
      api:
        condition: service_healthy
