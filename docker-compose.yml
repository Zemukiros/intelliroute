# IntelliRoute local development stack.
# All services run locally; nothing here provisions cloud resources.
#
#   docker compose up --build
#
# api:        Spring Boot routing engine     -> http://localhost:8080
# ai-service: FastAPI ranking scaffold       -> http://localhost:8090
# web:        Next.js frontend               -> http://localhost:3000

services:
  api:
    build:
      context: ./services/api
    ports:
      - "8080:8080"
    environment:
      INTELLIROUTE_CORS_ALLOWED_ORIGINS: http://localhost:3000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  ai-service:
    build:
      context: ./services/ai-service
    ports:
      - "8090:8090"
    environment:
      RANKING_PROVIDER: mock

  web:
    build:
      context: ./apps/web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    depends_on:
      api:
        condition: service_healthy
